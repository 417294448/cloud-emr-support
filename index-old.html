<head>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cloud EMR Version Intelligence Console</title>
  <script>
    (function () {
      var saved = localStorage.getItem('cloud-emr-theme');
      if (saved === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

:root {
  --font-display: 'IBM Plex Mono', 'Cascadia Code', Consolas, monospace;
  --font-body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;

  /* Day theme (default) */
  --bg: #f5f1e8;
  --bg-elevated: #ffffff;
  --bg-panel: #ffffff;
  --bg-panel-alt: #f0ece0;
  --border: #ddd6c5;
  --border-strong: #c7bfa8;

  --text-primary: #262220;
  --text-secondary: #5c564c;
  --text-muted: #948c7a;

  --accent: #c8791a;
  --accent-rgb: 200, 121, 26;
  --accent-strong: #a8630f;
  --accent-soft: rgba(200, 121, 26, 0.1);
  --accent-2: #0f8a7c;
  --accent-2-rgb: 15, 138, 124;
  --grid-line: rgba(0, 0, 0, 0.035);
}

[data-theme='dark'] {
  --bg: #0b0d10;
  --bg-elevated: #12151a;
  --bg-panel: #15181e;
  --bg-panel-alt: #1a1e25;
  --border: #262b33;
  --border-strong: #3a4048;

  --text-primary: #e8ecf1;
  --text-secondary: #8b95a3;
  --text-muted: #565f6c;

  --accent: #ffb020;
  --accent-rgb: 255, 176, 32;
  --accent-strong: #ffc85c;
  --accent-soft: rgba(255, 176, 32, 0.12);
  --accent-2: #4fd1c5;
  --accent-2-rgb: 79, 209, 197;
  --grid-line: rgba(255, 255, 255, 0.025);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: var(--font-body);
  color: var(--text-primary);
  background-color: var(--bg);
  background-image:
    radial-gradient(circle at 12% 0%, rgba(var(--accent-rgb), 0.08), transparent 45%),
    radial-gradient(circle at 100% 20%, rgba(var(--accent-2-rgb), 0.06), transparent 40%),
    repeating-linear-gradient(0deg, var(--grid-line) 0px, var(--grid-line) 1px, transparent 1px, transparent 40px),
    repeating-linear-gradient(90deg, var(--grid-line) 0px, var(--grid-line) 1px, transparent 1px, transparent 40px);
  min-height: 100vh;
  transition: background-color 0.25s ease, color 0.25s ease;
}

/* ---------- Header ---------- */

.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 22px 32px 20px;
  background: linear-gradient(180deg, var(--bg-elevated), rgba(0, 0, 0, 0));
  border-bottom: 1px solid var(--border);
  transition: background-color 0.25s ease, border-color 0.25s ease;
}

.header-titles h1 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 19px;
  font-weight: 600;
  letter-spacing: 0.02em;
  display: flex;
  align-items: center;
  gap: 12px;
}

.header-titles h1::before {
  content: '';
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0.55);
  animation: pulseDot 2.4s ease-in-out infinite;
  flex-shrink: 0;
}

.header-titles::after {
  content: 'RELEASE INTELLIGENCE CONSOLE  //  AWS \00b7  AZURE \00b7  GCP \00b7  ALIBABA CLOUD';
  display: block;
  margin: 8px 0 0 21px;
  font-family: var(--font-display);
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--text-muted);
}

.theme-toggle {
  flex-shrink: 0;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid var(--border-strong);
  background: var(--bg-elevated);
  color: var(--text-primary);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  line-height: 1;
  transition: border-color 0.15s ease, transform 0.2s ease, background-color 0.15s ease;
}

.theme-toggle:hover {
  border-color: var(--accent);
  transform: rotate(14deg);
}

.theme-toggle::before {
  content: '\1F319';
}

[data-theme='dark'] .theme-toggle::before {
  content: '\2600\FE0F';
}

/* ---------- Tab bars ---------- */

.provider-tab-bar {
  display: flex;
  gap: 2px;
  padding: 0 32px;
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border);
  transition: background-color 0.25s ease, border-color 0.25s ease;
}

.sub-tab-bar {
  display: flex;
  gap: 2px;
  border-bottom: 1px solid var(--border);
  counter-reset: tabnum;
}

.provider-tab-btn,
.sub-tab-btn {
  position: relative;
  padding: 13px 20px;
  border: none;
  background: transparent;
  cursor: pointer;
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.02em;
  color: var(--text-secondary);
  border-bottom: 2px solid transparent;
  transition: color 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
}

.provider-tab-btn::before {
  display: none;
}

.provider-tab-logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  margin-right: 8px;
  vertical-align: middle;
  flex-shrink: 0;
  color: var(--text-muted);
  transition: color 0.15s ease;
}

.provider-tab-logo svg {
  display: block;
  width: 100%;
  height: 100%;
}

.provider-tab-btn:hover .provider-tab-logo {
  color: var(--text-primary);
}

.provider-tab-btn.active .provider-tab-logo {
  color: var(--accent);
}

.sub-tab-btn::before {
  counter-increment: tabnum;
  content: counter(tabnum, decimal-leading-zero) '  ';
  color: var(--accent);
  font-family: var(--font-display);
  font-size: 11px;
}

.provider-tab-btn:hover,
.sub-tab-btn:hover {
  color: var(--text-primary);
  background: rgba(var(--accent-rgb), 0.06);
}

.provider-tab-btn.active,
.sub-tab-btn.active {
  color: var(--text-primary);
  border-bottom-color: var(--accent);
  background: var(--accent-soft);
}

.provider-tab-btn.active::before {
  display: none;
}

.provider-tab-btn.disabled {
  color: var(--text-muted);
  cursor: not-allowed;
}

.provider-tab-btn.disabled::after {
  content: 'SOON';
  margin-left: 10px;
  padding: 1px 6px;
  font-family: var(--font-display);
  font-size: 9px;
  letter-spacing: 0.1em;
  color: var(--text-muted);
  border: 1px dashed var(--border-strong);
  border-radius: 3px;
}

.provider-tab-btn.disabled:hover {
  color: var(--text-muted);
  background: transparent;
}

/* ---------- Main panel ---------- */

.provider-panel {
  max-width: 1080px;
  margin: 28px auto 64px;
  padding: 28px 32px 36px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  box-shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.25);
  transition: background-color 0.25s ease, border-color 0.25s ease;
}

[data-theme='dark'] .provider-panel {
  box-shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.6);
}

.coming-soon {
  display: block;
  max-width: 360px;
  margin: 56px auto;
  padding: 36px 24px;
  text-align: center;
  border: 1px dashed var(--border-strong);
  border-radius: 4px;
  color: var(--text-muted);
  font-family: var(--font-display);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.coming-soon::before {
  content: '\23f3';
  display: block;
  font-size: 26px;
  margin-bottom: 14px;
  filter: grayscale(1) opacity(0.6);
}

.support-banner {
  position: relative;
  background: var(--bg-panel-alt);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: 4px;
  padding: 16px 20px 18px;
  margin-bottom: 24px;
  animation: fadeSlideIn 0.4s ease both;
}

.support-banner-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}

.support-banner-title {
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
}

.support-banner-link {
  font-size: 12px;
  color: var(--accent-2);
  text-decoration: none;
  border-bottom: 1px dotted var(--accent-2);
  white-space: nowrap;
}

.support-banner-link:hover {
  color: var(--text-primary);
  border-bottom-color: var(--text-primary);
}

.policy-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 16px;
}

.policy-badge {
  padding: 3px 10px;
  font-family: var(--font-display);
  font-size: 11px;
  letter-spacing: 0.02em;
  color: var(--accent);
  background: var(--accent-soft);
  border: 1px solid rgba(var(--accent-rgb), 0.35);
  border-radius: 999px;
  white-space: nowrap;
}

.policy-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
}

.policy-stat-label {
  font-family: var(--font-display);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 5px;
}

.policy-stat-value {
  font-family: var(--font-display);
  font-size: 13px;
  color: var(--text-primary);
  line-height: 1.4;
}

.sub-tab-panel {
  padding-top: 22px;
}

/* ---------- Query controls ---------- */

.query-panel {
  animation: fadeSlideIn 0.35s ease both;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 20px;
  margin-bottom: 20px;
}

.query-panel .field {
  margin-bottom: 0;
}

.query-panel label {
  font-family: var(--font-display);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.query-panel select {
  margin-left: 8px;
  padding: 6px 10px;
  font-family: var(--font-display);
  font-size: 13px;
  color: var(--text-primary);
  background: var(--bg-elevated);
  border: 1px solid var(--border-strong);
  border-radius: 3px;
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.query-panel select:hover {
  border-color: var(--accent);
}

.query-panel select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.result {
  animation: fadeSlideIn 0.3s ease both;
}

/* ---------- Table ---------- */

.data-table {
  border-collapse: collapse;
  width: 100%;
  font-size: 13px;
  margin-top: 14px;
}

.data-table th,
.data-table td {
  padding: 9px 14px;
  text-align: left;
  border-bottom: 1px solid var(--border);
}

.data-table thead th {
  font-family: var(--font-display);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
  background: var(--bg-panel-alt);
  border-bottom: 1px solid var(--border-strong);
}

.data-table td {
  font-family: var(--font-display);
  color: var(--text-primary);
}

.data-table tbody tr:nth-child(even) {
  background: rgba(var(--accent-rgb), 0.02);
}

.release-table th:last-child,
.release-table td:last-child {
  width: 44%;
}

.release-table td:last-child {
  font-family: var(--font-body);
  font-size: 12.5px;
  color: var(--text-secondary);
}

.data-table tbody tr {
  animation: rowIn 0.3s ease both;
  transition: background-color 0.12s ease, box-shadow 0.12s ease;
}

.data-table tbody tr:hover {
  background: var(--accent-soft);
  box-shadow: inset 3px 0 0 var(--accent);
}

.data-table tbody tr:nth-child(1) { animation-delay: 0ms; }
.data-table tbody tr:nth-child(2) { animation-delay: 20ms; }
.data-table tbody tr:nth-child(3) { animation-delay: 40ms; }
.data-table tbody tr:nth-child(4) { animation-delay: 60ms; }
.data-table tbody tr:nth-child(5) { animation-delay: 80ms; }
.data-table tbody tr:nth-child(6) { animation-delay: 100ms; }
.data-table tbody tr:nth-child(7) { animation-delay: 120ms; }
.data-table tbody tr:nth-child(8) { animation-delay: 140ms; }
.data-table tbody tr:nth-child(9) { animation-delay: 160ms; }
.data-table tbody tr:nth-child(10) { animation-delay: 180ms; }
.data-table tbody tr:nth-child(11) { animation-delay: 200ms; }
.data-table tbody tr:nth-child(12) { animation-delay: 220ms; }

.cell-empty {
  color: var(--text-muted);
  font-style: italic;
}

/* ---------- Buttons ---------- */

/* ---------- Compare mode ---------- */

.compare-checkboxes {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 8px;
  max-height: 220px;
  overflow-y: auto;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  padding: 14px;
  border-radius: 4px;
  margin-bottom: 16px;
}

.compare-checkboxes::-webkit-scrollbar {
  width: 8px;
}

.compare-checkboxes::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: 4px;
}

.compare-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-display);
  font-size: 12px;
  color: var(--text-secondary);
}

.compare-item input[type="checkbox"] {
  width: 15px;
  height: 15px;
  accent-color: var(--accent);
  cursor: pointer;
}

.compare-item:has(input:disabled) {
  color: var(--text-muted);
  opacity: 0.5;
}

.compare-item input[type="checkbox"]:disabled {
  cursor: not-allowed;
}

.empty-msg,
.hint {
  color: var(--text-muted);
  font-size: 12.5px;
  letter-spacing: 0.02em;
}

.hint {
  font-family: var(--font-display);
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: 0.08em;
}

/* ---------- Motion ---------- */

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes rowIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulseDot {
  0%, 100% { box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0.55); }
  50% { box-shadow: 0 0 0 6px rgba(var(--accent-rgb), 0); }
}

  </style>
</head>

  <script>
window.DomUtils = (function () {
  function el(tag, props, children) {
    const node = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(function (key) {
        const value = props[key];
        if (key === 'class') {
          node.className = value;
        } else if (key === 'onclick') {
          node.addEventListener('click', value);
        } else if (key === 'onchange') {
          node.addEventListener('change', value);
        } else {
          node.setAttribute(key, value);
        }
      });
    }
    (children || []).forEach(function (child) {
      if (child === null || child === undefined) return;
      node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
    });
    return node;
  }

  function clear(node) {
    while (node.firstChild) {
      node.removeChild(node.firstChild);
    }
  }

  function formatCell(value) {
    if (value === null || value === undefined || value === '') {
      return el('span', { class: 'cell-empty' }, ['—']);
    }
    return String(value);
  }

  function renderTable(headers, rows, extraClass) {
    const thead = el('thead', null, [
      el('tr', null, headers.map(function (h) { return el('th', null, [h]); })),
    ]);
    const tbody = el('tbody', null, rows.map(function (row) {
      return el('tr', null, row.map(function (cell) { return el('td', null, [formatCell(cell)]); }));
    }));
    const tableClass = extraClass ? 'data-table ' + extraClass : 'data-table';
    return el('table', { class: tableClass }, [thead, tbody]);
  }

  function renderStatTiles(stats) {
    return el('div', { class: 'policy-stats' }, stats.map(function (stat) {
      return el('div', { class: 'policy-stat' }, [
        el('div', { class: 'policy-stat-label' }, [stat.label]),
        el('div', { class: 'policy-stat-value' }, [formatCell(stat.value)]),
      ]);
    }));
  }

  return {
    el: el,
    clear: clear,
    renderTable: renderTable,
    formatCell: formatCell,
    renderStatTiles: renderStatTiles,
  };
})();

  <script>
(function (root) {
  function getSeriesKeys(data) {
    return Object.keys(data)
      .filter(function (k) { return /^\d+\.x$/.test(k); })
      .sort(function (a, b) { return parseFloat(b) - parseFloat(a); });
  }

  function getAppNames(seriesData) {
    return Object.keys(seriesData.applications).sort();
  }

  function getReleaseRow(seriesData, release) {
    return getAppNames(seriesData).map(function (app) {
      return [app, seriesData.applications[app][release]];
    });
  }

  function getAppHistory(seriesData, app) {
    return seriesData.releases.map(function (release) {
      return [release, seriesData.applications[app][release]];
    });
  }

  function getDistinctVersions(seriesData, app) {
    const versions = [];
    seriesData.releases.forEach(function (release) {
      const v = seriesData.applications[app][release];
      if (v && versions.indexOf(v) === -1) versions.push(v);
    });
    return versions;
  }

  function findReleasesByVersion(seriesData, app, version) {
    return seriesData.releases.filter(function (release) {
      return seriesData.applications[app][release] === version;
    });
  }

  function compareReleases(data, selections) {
    const appNamesSet = {};
    selections.forEach(function (selection) {
      getAppNames(data[selection.series]).forEach(function (app) {
        appNamesSet[app] = true;
      });
    });
    const apps = Object.keys(appNamesSet).sort();
    const headers = ['Application'].concat(selections.map(function (s) { return s.release; }));
    const rows = apps.map(function (app) {
      const row = [app];
      selections.forEach(function (selection) {
        const seriesData = data[selection.series];
        row.push(seriesData.applications[app] ? seriesData.applications[app][selection.release] : null);
      });
      return row;
    });
    return { headers: headers, rows: rows };
  }

  const AwsEmrQueries = {
    getSeriesKeys: getSeriesKeys,
    getAppNames: getAppNames,
    getReleaseRow: getReleaseRow,
    getAppHistory: getAppHistory,
    getDistinctVersions: getDistinctVersions,
    findReleasesByVersion: findReleasesByVersion,
    compareReleases: compareReleases,
  };

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = AwsEmrQueries;
  } else {
    root.AwsEmrQueries = AwsEmrQueries;
  }

  <script>
window.AwsEmrView = (function () {
  const el = window.DomUtils.el;
  const clear = window.DomUtils.clear;
  const renderTable = window.DomUtils.renderTable;
  const renderStatTiles = window.DomUtils.renderStatTiles;
  const q = window.AwsEmrQueries;

  function renderSupportBanner(data) {
    const policy = data.standardSupportPolicy;
    if (!policy) return el('div');

    const releaseBadges = policy.releases.map(function (release) {
      return el('span', { class: 'policy-badge' }, [release.replace(' (all versions)', '')]);
    });

    const stats = renderStatTiles([
      { label: 'Initial release', value: policy.initialReleaseDate },
      { label: 'Standard support end', value: policy.standardSupportEndDate },
      { label: 'End of support', value: policy.endOfSupportStartDate },
      { label: 'End of life', value: policy.endOfLifeStartDate },
    ]);

    return el('div', { class: 'support-banner' }, [
      el('div', { class: 'support-banner-head' }, [
        el('span', { class: 'support-banner-title' }, ['Support Policy']),
        el('a', { class: 'support-banner-link', href: policy.source, target: '_blank' }, ['View official documentation source']),
      ]),
      el('div', { class: 'policy-badges' }, releaseBadges),
      stats,
    ]);
  }

  function renderSeriesSelect(seriesKeys, onChange) {
    return el('select', { class: 'series-select', onchange: function (e) { onChange(e.target.value); } },
      seriesKeys.map(function (key) { return el('option', { value: key }, [key]); })
    );
  }

  // ---- Mode 1: query by release ----
  function renderByRelease(container, data) {
    clear(container);
    const seriesKeys = q.getSeriesKeys(data);
    const state = { series: seriesKeys[0] };

    const releaseSelectWrap = el('div', { class: 'field' });
    const resultWrap = el('div', { class: 'result' });

    function renderResult(release) {
      clear(resultWrap);
      const seriesData = data[state.series];
      const descriptions = data.applicationDescriptions || {};
      const rows = q.getReleaseRow(seriesData, release).map(function (row) {
        return [row[0], row[1], descriptions[row[0]] || ''];
      });
      resultWrap.appendChild(renderTable(['Application', 'Version', 'Description'], rows, 'release-table'));
    }

    function renderReleaseOptions() {
      clear(releaseSelectWrap);
      const seriesData = data[state.series];
      const releaseSelect = el('select', {
        class: 'release-select',
        onchange: function (e) { renderResult(e.target.value); },
      }, seriesData.releases.map(function (r) { return el('option', { value: r }, [r]); }));
      releaseSelectWrap.appendChild(el('label', null, ['Release: ', releaseSelect]));
      renderResult(seriesData.releases[0]);
    }

    const seriesSelect = renderSeriesSelect(seriesKeys, function (value) {
      state.series = value;
      renderReleaseOptions();
    });

    container.appendChild(el('div', { class: 'query-panel' }, [
      el('div', { class: 'filters' }, [
        el('div', { class: 'field' }, [el('label', null, ['Series: ', seriesSelect])]),
        releaseSelectWrap,
      ]),
      resultWrap,
    ]));

    renderReleaseOptions();
  }

  // ---- Mode 2: query by application ----
  function renderByApp(container, data) {
    clear(container);
    const seriesKeys = q.getSeriesKeys(data);
    const state = { series: seriesKeys[0] };

    const appSelectWrap = el('div', { class: 'field' });
    const resultWrap = el('div', { class: 'result' });

    function renderResult(app) {
      clear(resultWrap);
      const seriesData = data[state.series];
      const history = q.getAppHistory(seriesData, app);
      resultWrap.appendChild(renderTable(['Release', 'Version'], history));
    }

    function renderAppOptions() {
      clear(appSelectWrap);
      const seriesData = data[state.series];
      const appNames = q.getAppNames(seriesData);
      const appSelect = el('select', {
        class: 'app-select',
        onchange: function (e) { renderResult(e.target.value); },
      }, appNames.map(function (a) { return el('option', { value: a }, [a]); }));
      appSelectWrap.appendChild(el('label', null, ['Application: ', appSelect]));
      renderResult(appNames[0]);
    }

    const seriesSelect = renderSeriesSelect(seriesKeys, function (value) {
      state.series = value;
      renderAppOptions();
    });

    container.appendChild(el('div', { class: 'query-panel' }, [
      el('div', { class: 'filters' }, [
        el('div', { class: 'field' }, [el('label', null, ['Series: ', seriesSelect])]),
        appSelectWrap,
      ]),
      resultWrap,
    ]));

    renderAppOptions();
  }

  // ---- Mode 3: reverse lookup by version ----
  function renderByVersion(container, data) {
    clear(container);
    const seriesKeys = q.getSeriesKeys(data);
    const state = { series: seriesKeys[0] };

    const appSelectWrap = el('div', { class: 'field' });
    const versionSelectWrap = el('div', { class: 'field' });
    const resultWrap = el('div', { class: 'result' });

    function renderResult(app, version) {
      clear(resultWrap);
      const seriesData = data[state.series];
      const releases = q.findReleasesByVersion(seriesData, app, version);
      if (releases.length === 0) {
        resultWrap.appendChild(el('p', { class: 'empty-msg' }, ['No releases found containing this version.']));
        return;
      }
      resultWrap.appendChild(renderTable(['Release'], releases.map(function (r) { return [r]; })));
    }

    function renderVersionOptions(app) {
      clear(versionSelectWrap);
      const seriesData = data[state.series];
      const versions = q.getDistinctVersions(seriesData, app);
      if (versions.length === 0) {
        clear(resultWrap);
        resultWrap.appendChild(el('p', null, ['This application has no tracked versions in this series.']));
        return;
      }
      const versionSelect = el('select', {
        class: 'version-select',
        onchange: function (e) { renderResult(app, e.target.value); },
      }, versions.map(function (v) { return el('option', { value: v }, [v]); }));
      versionSelectWrap.appendChild(el('label', null, ['Version: ', versionSelect]));
      renderResult(app, versions[0]);
    }

    function renderAppOptions() {
      clear(appSelectWrap);
      const seriesData = data[state.series];
      const appNames = q.getAppNames(seriesData);
      const appSelect = el('select', {
        class: 'app-select',
        onchange: function (e) { renderVersionOptions(e.target.value); },
      }, appNames.map(function (a) { return el('option', { value: a }, [a]); }));
      appSelectWrap.appendChild(el('label', null, ['Application: ', appSelect]));
      renderVersionOptions(appNames[0]);
    }

    const seriesSelect = renderSeriesSelect(seriesKeys, function (value) {
      state.series = value;
      renderAppOptions();
    });

    container.appendChild(el('div', { class: 'query-panel' }, [
      el('div', { class: 'filters' }, [
        el('div', { class: 'field' }, [el('label', null, ['Series: ', seriesSelect])]),
        appSelectWrap,
        versionSelectWrap,
      ]),
      resultWrap,
    ]));

    renderAppOptions();
  }

  // ---- Mode 4: compare releases (cross-series) ----
  const MAX_COMPARE = 4;

  function renderCompare(container, data) {
    clear(container);
    const seriesKeys = q.getSeriesKeys(data);
    const checkboxWrap = el('div', { class: 'compare-checkboxes' });
    const resultWrap = el('div', { class: 'result' });
    const hint = el('p', { class: 'hint' }, [
      'Check up to ' + MAX_COMPARE + ' releases from any series to compare (cross-series supported):',
    ]);
    const selections = [];
    const checkboxes = [];

    function updateCheckboxAvailability() {
      const atLimit = selections.length >= MAX_COMPARE;
      checkboxes.forEach(function (checkbox) {
        checkbox.disabled = atLimit && !checkbox.checked;
      });
    }

    function renderResult() {
      clear(resultWrap);
      if (selections.length === 0) {
        resultWrap.appendChild(el('p', { class: 'empty-msg' }, ['Select at least one release to compare.']));
        return;
      }
      const compared = q.compareReleases(data, selections);
      resultWrap.appendChild(renderTable(compared.headers, compared.rows));
    }

    seriesKeys.forEach(function (series) {
      data[series].releases.forEach(function (release) {
        const checkbox = el('input', {
          type: 'checkbox',
          onchange: function (e) {
            if (e.target.checked) {
              selections.push({ series: series, release: release });
            } else {
              const idx = selections.map(function (s) { return s.series + '|' + s.release; })
                .indexOf(series + '|' + release);
              if (idx !== -1) selections.splice(idx, 1);
            }
            updateCheckboxAvailability();
            renderResult();
          },
        });
        checkboxes.push(checkbox);
        checkboxWrap.appendChild(el('label', { class: 'compare-item' }, [checkbox, ' ' + release]));
      });
    });

    container.appendChild(el('div', { class: 'query-panel' }, [
      hint,
      checkboxWrap,
      resultWrap,
    ]));

    renderResult();
  }

  const MODES = [
    { id: 'by-release', label: 'By Release', render: renderByRelease },
    { id: 'by-app', label: 'By Application', render: renderByApp },
    { id: 'by-version', label: 'By Version', render: renderByVersion },
    { id: 'compare', label: 'Compare Releases', render: renderCompare },
  ];

  function mount(container, data) {
    clear(container);
    container.appendChild(renderSupportBanner(data));

    const tabBar = el('div', { class: 'sub-tab-bar' });
    const panel = el('div', { class: 'sub-tab-panel' });

    function selectMode(modeId) {
      Array.prototype.forEach.call(tabBar.children, function (btn) {
        btn.classList.toggle('active', btn.dataset.modeId === modeId);
      });
      const mode = MODES.filter(function (m) { return m.id === modeId; })[0];
      mode.render(panel, data);
    }

    MODES.forEach(function (mode) {
      const btn = el('button', {
        class: 'sub-tab-btn',
        onclick: function () { selectMode(mode.id); },
      }, [mode.label]);
      btn.dataset.modeId = mode.id;
      tabBar.appendChild(btn);
    });

    container.appendChild(tabBar);
    container.appendChild(panel);

    selectMode(MODES[0].id);
  }

  return { mount: mount };
})();

      el('div', { class: 'filters' }, [
        el('div', { class: 'field' }, [el('label', null, ['Series: ', seriesSelect])]),
        releaseSelectWrap,
      ]),
      lifecycleWrap,
      resultWrap,
    ]));

    renderReleaseOptions();
  }

  // ---- Mode 2: query by application ----
  function renderByApp(container, data) {
    clear(container);
    const seriesKeys = q.getSeriesKeys(data);
    const state = { series: seriesKeys[0] };

    const appSelectWrap = el('div', { class: 'field' });
    const resultWrap = el('div', { class: 'result' });

    function renderResult(app) {
      clear(resultWrap);
      const seriesData = data[state.series];
      const history = q.getAppHistory(seriesData, app);
      resultWrap.appendChild(renderTable(['Release', 'Version'], history));
    }

    function renderAppOptions() {
      clear(appSelectWrap);
      const seriesData = data[state.series];
      const appNames = q.getAppNames(seriesData);
      const appSelect = el('select', {
        class: 'app-select',
        onchange: function (e) { renderResult(e.target.value); },
      }, appNames.map(function (a) { return el('option', { value: a }, [a]); }));
      appSelectWrap.appendChild(el('label', null, ['Application: ', appSelect]));
      renderResult(appNames[0]);
    }

    const seriesSelect = renderSeriesSelect(seriesKeys, function (value) {
      state.series = value;
      renderAppOptions();
    });

    container.appendChild(el('div', { class: 'query-panel' }, [
      el('div', { class: 'filters' }, [
        el('div', { class: 'field' }, [el('label', null, ['Series: ', seriesSelect])]),
        appSelectWrap,
      ]),
      resultWrap,
    ]));

    renderAppOptions();
  }

  // ---- Mode 3: reverse lookup by version ----
  function renderByVersion(container, data) {
    clear(container);
    const seriesKeys = q.getSeriesKeys(data);
    const state = { series: seriesKeys[0] };

    const appSelectWrap = el('div', { class: 'field' });
    const versionSelectWrap = el('div', { class: 'field' });
    const resultWrap = el('div', { class: 'result' });

    function renderResult(app, version) {
      clear(resultWrap);
      const seriesData = data[state.series];
      const releases = q.findReleasesByVersion(seriesData, app, version);
      if (releases.length === 0) {
        resultWrap.appendChild(el('p', { class: 'empty-msg' }, ['No releases found containing this version.']));
        return;
      }
      resultWrap.appendChild(renderTable(['Release'], releases.map(function (r) { return [r]; })));
    }

    function renderVersionOptions(app) {
      clear(versionSelectWrap);
      const seriesData = data[state.series];
      const versions = q.getDistinctVersions(seriesData, app);
      if (versions.length === 0) {
        clear(resultWrap);
        resultWrap.appendChild(el('p', null, ['This application has no tracked versions in this series.']));
        return;
      }
      const versionSelect = el('select', {
        class: 'version-select',
        onchange: function (e) { renderResult(app, e.target.value); },
      }, versions.map(function (v) { return el('option', { value: v }, [v]); }));
      versionSelectWrap.appendChild(el('label', null, ['Version: ', versionSelect]));
      renderResult(app, versions[0]);
    }

    function renderAppOptions() {
      clear(appSelectWrap);
      const seriesData = data[state.series];
      const appNames = q.getAppNames(seriesData);
      const appSelect = el('select', {
        class: 'app-select',
        onchange: function (e) { renderVersionOptions(e.target.value); },
      }, appNames.map(function (a) { return el('option', { value: a }, [a]); }));
      appSelectWrap.appendChild(el('label', null, ['Application: ', appSelect]));
      renderVersionOptions(appNames[0]);
    }

    const seriesSelect = renderSeriesSelect(seriesKeys, function (value) {
      state.series = value;
      renderAppOptions();
    });

    container.appendChild(el('div', { class: 'query-panel' }, [
      el('div', { class: 'filters' }, [
        el('div', { class: 'field' }, [el('label', null, ['Series: ', seriesSelect])]),
        appSelectWrap,
        versionSelectWrap,
      ]),
      resultWrap,
    ]));

    renderAppOptions();
  }

  // ---- Mode 4: compare releases (cross-series) ----
  const MAX_COMPARE = 4;

  function renderCompare(container, data) {
    clear(container);
    const seriesKeys = q.getSeriesKeys(data);
    const checkboxWrap = el('div', { class: 'compare-checkboxes' });
    const resultWrap = el('div', { class: 'result' });
    const hint = el('p', { class: 'hint' }, [
      'Check up to ' + MAX_COMPARE + ' releases from any series to compare (cross-series supported):',
    ]);
    const selections = [];
    const checkboxes = [];

    function updateCheckboxAvailability() {
      const atLimit = selections.length >= MAX_COMPARE;
      checkboxes.forEach(function (checkbox) {
        checkbox.disabled = atLimit && !checkbox.checked;
      });
    }

    function renderResult() {
      clear(resultWrap);
      if (selections.length === 0) {
        resultWrap.appendChild(el('p', { class: 'empty-msg' }, ['Select at least one release to compare.']));
        return;
      }
      const compared = q.compareReleases(data, selections);
      resultWrap.appendChild(renderTable(compared.headers, compared.rows));
    }

    seriesKeys.forEach(function (series) {
      data[series].releases.forEach(function (release) {
        const checkbox = el('input', {
          type: 'checkbox',
          onchange: function (e) {
            if (e.target.checked) {
              selections.push({ series: series, release: release });
            } else {
              const idx = selections.map(function (s) { return s.series + '|' + s.release; })
                .indexOf(series + '|' + release);
              if (idx !== -1) selections.splice(idx, 1);
            }
            updateCheckboxAvailability();
            renderResult();
          },
        });
        checkboxes.push(checkbox);
        checkboxWrap.appendChild(el('label', { class: 'compare-item' }, [checkbox, ' ' + release]));
      });
    });

    container.appendChild(el('div', { class: 'query-panel' }, [
      hint,
      checkboxWrap,
      resultWrap,
    ]));

    renderResult();
  }

  const MODES = [
    { id: 'by-release', label: 'By Release', render: renderByRelease },
    { id: 'by-app', label: 'By Application', render: renderByApp },
    { id: 'by-version', label: 'By Version', render: renderByVersion },
    { id: 'compare', label: 'Compare Releases', render: renderCompare },
  ];

  function mount(container, data) {
    clear(container);
    container.appendChild(renderSupportBanner(data));

    const tabBar = el('div', { class: 'sub-tab-bar' });
    const panel = el('div', { class: 'sub-tab-panel' });

    function selectMode(modeId) {
      Array.prototype.forEach.call(tabBar.children, function (btn) {
        btn.classList.toggle('active', btn.dataset.modeId === modeId);
      });
      const mode = MODES.filter(function (m) { return m.id === modeId; })[0];
      mode.render(panel, data);
    }

    MODES.forEach(function (mode) {
      const btn = el('button', {
        class: 'sub-tab-btn',
        onclick: function () { selectMode(mode.id); },
      }, [mode.label]);
      btn.dataset.modeId = mode.id;
      tabBar.appendChild(btn);
    });

    container.appendChild(tabBar);
    container.appendChild(panel);

    selectMode(MODES[0].id);
  }

  return { mount: mount };
})();

  </script>

    gcp: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.19 2.38a9.344 9.344 0 0 0-9.234 6.893c.053-.02-.055.013 0 0-3.875 2.551-3.922 8.11-.247 10.941l.006-.007-.007.03a6.717 6.717 0 0 0 4.077 1.356h5.173l.03.03h5.192c6.687.053 9.376-8.605 3.835-12.35a9.365 9.365 0 0 0-2.821-4.552l-.043.043.006-.05A9.344 9.344 0 0 0 12.19 2.38zm-.358 4.146c1.244-.04 2.518.368 3.486 1.15a5.186 5.186 0 0 1 1.862 4.078v.518c3.53-.07 3.53 5.262 0 5.193h-5.193l-.008.009v-.04H6.785a2.59 2.59 0 0 1-1.067-.23h.001a2.597 2.597 0 1 1 3.437-3.437l3.013-3.012A6.747 6.747 0 0 0 8.11 8.24c.018-.01.04-.026.054-.023a5.186 5.186 0 0 1 3.67-1.69z"/></svg>',

  };

  // 用 <template> 让浏览器按 HTML foreign-content 规则正确解析出带 SVG 命名空间的节点
  function parseLogoSvg(markup) {
    const template = document.createElement('template');
    template.innerHTML = markup.trim();
    const node = template.content.firstElementChild;
    if (node) {
      // 顶层显式声明 currentColor，子节点未设置 fill 时会继承此值
      node.setAttribute('fill', 'currentColor');
    }
    return node;
  }

  const PROVIDERS = [
    { id: 'aws', label: 'AWS EMR', dataKey: 'aws', view: window.AwsEmrView, logo: PROVIDER_LOGOS.aws },
    { id: 'azure', label: 'Azure HDInsight', dataKey: 'azure', view: window.AzureHdinsightView, logo: PROVIDER_LOGOS.azure },
    { id: 'gcp', label: 'GCP Dataproc', dataKey: 'gcp', view: window.GcpDataprocView, logo: PROVIDER_LOGOS.gcp },
    { id: 'aliyun', label: 'Alibaba Cloud EMR', dataKey: 'aliyun', view: window.AliyunEmrView, logo: PROVIDER_LOGOS.aliyun },
  ];

  function init() {
    const cloudData = window.CLOUD_DATA || {};
    const tabBar = document.getElementById('provider-tab-bar');
    const panel = document.getElementById('provider-panel');

    function selectProvider(providerId) {
      Array.prototype.forEach.call(tabBar.children, function (btn) {
        btn.classList.toggle('active', btn.dataset.providerId === providerId);
      });
      const provider = PROVIDERS.filter(function (p) { return p.id === providerId; })[0];
      const data = cloudData[provider.dataKey];
      clear(panel);
      if (!data || !provider.view) {
        panel.appendChild(el('p', { class: 'coming-soon' }, ['Not yet supported. Coming soon.']));
        return;
      }
      provider.view.mount(panel, data);
    }

    PROVIDERS.forEach(function (provider) {
      const available = Boolean(cloudData[provider.dataKey]) && Boolean(provider.view);
      const btn = el('button', {
        class: available ? 'provider-tab-btn' : 'provider-tab-btn disabled',
        onclick: function () {
          if (!available) return;
          selectProvider(provider.id);
        },
      }, []);
      btn.dataset.providerId = provider.id;
      if (provider.logo) {
        const logoWrap = el('span', { class: 'provider-tab-logo' }, []);
        const svgNode = parseLogoSvg(provider.logo);
        if (svgNode) logoWrap.appendChild(svgNode);
        btn.appendChild(logoWrap);
      }
      btn.appendChild(el('span', { class: 'provider-tab-label' }, [provider.label]));
      tabBar.appendChild(btn);
    });

    const firstAvailable = PROVIDERS.filter(function (p) {
      return cloudData[p.dataKey] && p.view;
    })[0];
    if (firstAvailable) {
      selectProvider(firstAvailable.id);
    }
  }

  document.addEventListener('DOMContentLoaded', init);
})();

  <script>
(function () {
  var STORAGE_KEY = 'cloud-emr-theme';
  var toggle = document.getElementById('theme-toggle');
  if (!toggle) return;

  function currentTheme() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  }

  toggle.addEventListener('click', function () {
    var next = currentTheme() === 'dark' ? 'light' : 'dark';
    if (next === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
    localStorage.setItem(STORAGE_KEY, next);
  });
})();

  </script>
